name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Run Tests
        run: mvn -B test

      - name: Archive Test Reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/reports
            target/site/jacoco
          retention-days: 7
